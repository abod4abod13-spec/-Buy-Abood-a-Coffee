<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تخطي الرابط - الوصول للمحتوى</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #818cf8;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        h1 {
            font-size: 22px;
            color: #e2e8f0;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .timer-box {
            font-size: 28px;
            font-weight: bold;
            color: #facc15;
            margin: 15px 0;
        }
        .ad-area {
            background: #334155;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--secondary-color);
        }
        .btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 14px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .progress-bar {
            height: 6px;
            background: #334155;
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>جاري تجهيز الرابط النهائي</h1>
    <p>يرجى الانتظار للحصول على رابط التنزيل/الانتقال</p>

    <div class="timer-box" id="timer">10</div>

    <div class="ad-area">
        <!-- ضع شفرة الإعلان الإعلاني (Banner / Native) هنا -->
        <span style="color: #cbd5e1; font-size: 13px;">[ مساحة إعلانية ]</span>
    </div>

    <button id="action-btn" class="btn" disabled onclick="nextStep()">انتظر العداد...</button>

    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>
</div>

<script>
    // قائمة الروابط الإعلانية للمراحل
    const steps = [
        { adUrl: "https://example.com/ad1", label: "الانتقال إلى الخطوة التالية 🚀" },
        { adUrl: "https://example.com/ad2", label: "الانتقال إلى الرابط النهائي 🔗" }
    ];

    let currentStep = 0;
    let timeLeft = 10;
    let timerId = null;

    const timerEl = document.getElementById('timer');
    const btnEl = document.getElementById('action-btn');
    const progressEl = document.getElementById('progress');

    function startTimer() {
        timeLeft = 10;
        btnEl.disabled = true;
        btnEl.innerText = "انتظر العداد...";
        timerEl.innerText = timeLeft;

        timerId = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerId);
                timerEl.innerText = "جاهز!";
                btnEl.disabled = false;
                btnEl.innerText = steps[currentStep].label;
            }
        }, 1000);
    }

    function nextStep() {
        // فتح رابط الإعلان في تبويب جديد لتوليد الظهور والزيارة
        window.open(steps[currentStep].adUrl, '_blank');

        currentStep++;
        let progressPercent = (currentStep / steps.length) * 100;
        progressEl.style.width = progressPercent + "%";

        if (currentStep < steps.length) {
            startTimer();
        } else {
            // توجيه للرابط النهائي بعد اتمام كافة المراحل
            btnEl.innerText = "تم التوجيه بنجاح 🎉";
            btnEl.disabled = true;
            timerEl.innerText = "✓";
        }
    }

    // بدء العداد عند التحميل
    startTimer();
</script>

</body>
</html>
