<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الخدمات والأدوات الحصرية | Abood Hub</title>
    <meta name="theme-color" content="#0a0f1c">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0a0f1c;
            --card-bg: rgba(19, 27, 46, 0.9);
            --primary: #3b82f6;
            --accent: #10b981;
            --text: #ffffff;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: rgba(10, 15, 28, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .ad-container-top {
            margin: 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            max-width: 1100px;
            width: 95%;
            margin: 20px auto;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn-smartlink {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 15px 35px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 18px;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s ease;
        }

        .btn-smartlink:hover {
            transform: scale(1.05);
        }

        .sidebar-ad {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚀 منصة الخدمات والأدوات المتقدمة</h1>
        
        <!-- المساحة الإعلانية الأولى: Banner 468x60 -->
        <div class="ad-container-top">
            <script>
              atOptions = {
                'key' : '76a0a520b4cd909196480182e3903e2f',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/76a0a520b4cd909196480182e3903e2f/invoke.js"></script>
        </div>
    </header>

    <main class="main-layout">
        
        <!-- المحتوى الرئيسي -->
        <section class="content-card">
            <h2>✨ اضغط للانتقال إلى الرابط المباشر</h2>
            <p style="color: #94a3b8; margin-top: 10px;">انقر على الزر أدناه للوصول الحصري وتفعيل الأداة بشكل مباشر:</p>

            <!-- زر الـ SmartLink الخاص بك -->
            <a href="https://www.effectivecpmnetwork.com/zf4q3bhtg?key=26f83416f12103c95906013ae5b90402" target="_blank" class="btn-smartlink">
                ⚡ الدخول وإكمال العملية الآن
            </a>

            <!-- الإعلان المتداخل Container -->
            <div style="margin-top: 30px;">
                <script async="async" data-cfasync="false" src="https://pl30496066.effectivecpmnetwork.com/3620661553e2cca9a8c10f5a9eb0a1b0/invoke.js"></script>
                <div id="container-3620661553e2cca9a8c10f5a9eb0a1b0"></div>
            </div>
        </section>

        <!-- الشريط الجانبي للإعلانات -->
        <aside class="sidebar-ad">
            <p style="font-size: 12px; color: #64748b; margin-bottom: 10px;">إعلان ممول</p>
            
            <!-- المساحة الإعلانية الثانية: Banner 160x300 -->
            <script>
              atOptions = {
                'key' : 'd2bed629b5df02ff3f3cc1252eb7fb14',
                'format' : 'iframe',
                'height' : 300,
                'width' : 160,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/d2bed629b5df02ff3f3cc1252eb7fb14/invoke.js"></script>
        </aside>

    </main>

    <footer>
        <p>جميع الحقوق محفوظة © 2026</p>
    </footer>

    <!-- شفرة الإعلانات المنبثقة والـ Popunder الخارجية -->
    <script src="https://pl30496065.effectivecpmnetwork.com/fa/a4/cf/faa4cf5ab4f85a5a7829e262794f3bd6.js"></script>

</body>
</html>
