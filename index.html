    <style>
        :root {
            --bg-color: #0a0f1c;
            --card-bg: rgba(19, 27, 46, 0.9);
            --primary: #3b82f6;
            --accent: #10b981;
            --text: #ffffff;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: rgba(10, 15, 28, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .ad-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0;
        }

        .main-container {
            max-width: 1200px;
            width: 95%;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            gap: 15px;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .side-banner {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .content-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .btn-smartlink {

            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
            margin: 15px 0;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        footer {
